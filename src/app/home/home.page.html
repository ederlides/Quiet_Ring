<ion-app>
  <ion-content class="ion-padding" >
    <div *ngIf="phase == 0" class="logo-container">
      <img src="../../assets/logo.svg" alt="Quiet Ring Logo" class="logo" />
    </div>
    <ion-content *ngIf="phase == 2" class="ion-padding ion-safe-area">
      <div style="width: 100%; position: relative; margin-top: 40px;">
        <swiper-container
          #swiperEl
          pagination="true"
          navigation="false"
          loop="false"
          id="mySwiper"
          style="
            width: 100%; 
            height: 700px; 
            --swiper-pagination-color: #EA592D;
            --swiper-pagination-bullet-inactive-color: #334295;
            --swiper-pagination-bullet-inactive-opacity: 1;
            --swiper-pagination-bullet-size: 11px;
            --swiper-pagination-bullet-horizontal-gap: 3px;
          "
          (swiperslidechange)="onSlideChange()"
        >
          <swiper-slide
            *ngFor="let item of arraySplas; let i = index"
            class="slide-down"
            [ngClass]="{ 'slide-up': activeIndex === i }"
          >
            <div class="image-container">
              <img [src]="item.img" class="logo" />
            </div>
            <ion-title class="custom-title">
              <span style="white-space: normal;">{{ item.title }}</span>
            </ion-title>
            <p class="description">{{ item.description }}</p>
          </swiper-slide>
        </swiper-container>
        <!-- <ion-button fill="clear" class="custom-prev" (click)="slidePrev()">
          <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="custom-next" (click)="slideNext()">
          <ion-icon name="arrow-forward" slot="icon-only"></ion-icon>
        </ion-button> -->
      </div>
    </ion-content>
  </ion-content>
  <ion-footer *ngIf="showButton" class="ion-padding">
    <ion-button expand="block" fill="solid" class="custom-btn btn-solid" href="/login">
      Continuar
    </ion-button>
  </ion-footer>
</ion-app>

<div class="container-loader">

    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>

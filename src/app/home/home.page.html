<ion-app>
  <ion-content class="ion-padding">
    <div *ngIf="phase == 0" class="logo-container">
      <img src="assets/logo.svg" alt="Quiet Ring Logo" class="logo" />
    </div>
    <ng-container *ngIf="phase == 2" class="ion-padding ion-safe-area">
      <div class="container-carousel">
        <swiper-container
          #swiperEl
          pagination="true"
          navigation="false"
          loop="false"
          id="mySwiper"
          style="
            width: 100%; 
            height: 700px; 
            --swiper-pagination-color: #EA592D;
            --swiper-pagination-bullet-inactive-color: #334295;
            --swiper-pagination-bullet-inactive-opacity: 1;
            --swiper-pagination-bullet-size: 11px;
            --swiper-pagination-bullet-horizontal-gap: 3px;
          "
          (swiperslidechange)="onSlideChange()"
        >
          <swiper-slide
            *ngFor="let item of arraySplas; let i = index"
            class="slide-down"
            [ngClass]="{ 'slide-up': activeIndex === i }"
          >
            <div class="image-container">
              <img [src]="item.img" class="logo" />
            </div>
            <ion-title class="custom-title">
              <span style="white-space: normal;">{{ item.title }}</span>
            </ion-title>
            <p class="description">{{ item.description }}</p>
          </swiper-slide>
        </swiper-container>
      </div>
    </ng-container>
  </ion-content>
  <ion-footer class="ion-padding" style="box-shadow: none; transition: 300ms;" [ngStyle]="showButton ? { opacity: 1, pointerEvents: 'auto' } : { opacity: 0, pointerEvents: 'none' }">
    <ion-button expand="block" fill="solid" class="custom-btn btn-solid" href="/login">
      Continuar
    </ion-button>
  </ion-footer>
</ion-app>

<div class="container-loader">
  <div class="loader" style="width: 300px;" *ngIf="phase == 1">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <img src="assets/bell-login.svg" alt="Bell-login" class="bell" />
  </div>
</div>

<ion-content class="ion-padding call-content custom-background">
  <div class="overlay">
    <div class="top-text">
      <h2>{{ 'userName' }}</h2>
      <p>{{this.webrtc.camera}}</p>
    </div>
    <div class="video-container">
      <video #remote autoplay playsinline class="video-remote" ></video>
      <video #local autoplay playsinline class="video-local" muted (mousedown)="onDragStart($event)"
        (touchstart)="onDragStart($event)"></video>

    </div>
    <div class="button-group">
      <ion-button fill="clear" class="control-button" (click)="toggleCamera()">
        <ion-icon name="videocam-outline"></ion-icon>
      </ion-button>

      <ion-button fill="clear" class="control-button" (click)="toggleSpeaker()">
        <ion-icon name="volume-high-outline"></ion-icon>
      </ion-button>

      <ion-button fill="clear" class="control-button" (click)="toggleMute()">
        <ion-icon name="mic-off-outline"></ion-icon>
      </ion-button>

      <ion-button fill="clear" color="lighter" class="control-button end-button" (click)="endCall()">
        <ion-icon name="call-outline"></ion-icon>
      </ion-button>
    </div>

  </div>
</ion-content>

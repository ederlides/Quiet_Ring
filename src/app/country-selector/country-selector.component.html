<ion-header class="ion-padding custom-ion-header custom-padding-header" style="padding-bottom: 0;">
  <ion-toolbar>
    <ion-button slot="start" fill="clear" class="custom-back-button" (click)="dismiss()">
      <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-title class="custom-title"><span style="white-space: normal;">Elige el país</span></ion-title>
    <ion-searchbar 
      #searchBar
      [(ngModel)]="searchTerm"
      (ionInput)="filterCountries()"
      placeholder="Buscar país o código"
      animated
      debounce="300"
      style=""
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>
    <ion-item *ngFor="let country of filteredCountries" (click)="selectCountry(country)" button detail="true">
      <ion-avatar slot="start">
        <img [src]="country.flag" alt="{{country.name}}" onerror="this.onerror=null; this.src='assets/icon/placeholder-flag.svg';" />
      </ion-avatar>
      <ion-label>
        <h2>{{country.name}}</h2>
        <p>{{country.dialCode}}</p>
      </ion-label>
    </ion-item>

    <ion-item *ngIf="filteredCountries.length === 0">
      <ion-label color="medium" class="ion-text-center">
        No se encontraron países para "{{searchTerm}}"
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
